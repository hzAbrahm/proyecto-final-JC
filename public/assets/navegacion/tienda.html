<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calles Dulces | Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Lobster&family=Playwrite+IT+Trad:wght@100..400&family=Xmind:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/bootstrap-icons.css">
</head>

<body>
  <header>
    <div id="encabezado-superior">
      <h1 id="name"><a href="../../index.html">Calles Dulces</a></h1>
    </div>
    <div id="encabezado-inferior">
      <button class="boton-carrito">
        <a href="carrito.html" aria-label="Mi carrito"><i class="bi bi-cart3" aria-hidden="true"></i></a>
      </button>
      <div id="hamburguer">
        <button id="abrir" class="boton-abrir" type="button">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <nav aria-label="Menú principal" class="nav" id="nav">
          <button id="cerrar" class="boton-cerrar" type="button">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
          <a href="../../index.html">inicio</a>
          <a href="tienda.html">tienda</a>
          <a href="donaciones.html">¿quieres donar?</a>
          <a href="#contactanos">contactanos</a>

        </nav>
      </div>
    </div>
  </header>

  <main id="tienda">
    <section id="favoritos">
      <h2>Tienda principal</h2>
      <h3>favoritos de la semana</h3>
      <ul class="allproducts">
        <li class="producto">
          <h4>tiramisu</h4>
          <div class="imagenproducto">
            <img src="../img/productos/tiramisu.jpg" alt="Tiramisú" width="150">
            <button type="button" class="añadir-producto">añadir al carrito</button>
            <p class="precio">10.000 cop</p>
          </div>
        </li>
      </ul>
    </section>

    <section id="catalogo">
      <h2>productos</h2>

      <form id="form-busqueda" role="search">
        <label for="buscar-postre">¿ya tienes algo en mente? ¡buscalo!</label>
        <input type="search" id="buscar-postre" name="producto" placeholder="buscar postre..." required>
        <button type="submit">buscar</button>
      </form>

      <form id="form-recomendacion">
        <label for="recomendar-postre">¿algun postre que no este en nuestro catalogo? ¡dinoslo!</label>
        <input type="text" id="recomendar-postre" name="recomendacion" placeholder="recomendacion..." required>
        <button type="submit">enviar</button>
      </form>

      <ul class="allproducts">
        <li class="producto">
          <h3>brownie</h3>
          <div class="imagenproducto">
            <img src="../img/productos/brownie sencillo.jpg" alt="Brownie sencillo" width="300">
            <button type="button" class="añadir-producto">añadir al carrito</button>
            <p class="precio">3.000 cop</p>
            <div class="especificaciones">
              <p>30gr azucar, etc...</p>
            </div>
          </div>
        </li>
      </ul>
    </section>
  </main>

  <footer id="contactanos">
    <h2>Contactanos</h2>
    <p>Siguenos en nuestras redes sociales: -redes sociales-</p>
  </footer>
  <script src="../js/options.js"></script>
</body>

</html>
